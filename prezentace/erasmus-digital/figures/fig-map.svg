    <polygon points="1170,410 1135,392 1135,428" fill="#6B7085"/>
    <text x="40" y="465" font-size="24" fill="#6B7085">saves the teacher's time</text>
    <text x="1160" y="465" text-anchor="end" font-size="24" fill="#6B7085">changes how students learn</text>
